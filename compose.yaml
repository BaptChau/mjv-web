services:
  caddy:
    image: caddy:2-alpine
    container_name: mjv-web-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app-dev
      platforms:
        - linux/arm64
    container_name: mjv-web-app
    environment:
      APP_ENV: dev
      DATABASE_URL: ${DATABASE_URL}
    volumes:
      - ./:/app:rw,cached
    expose:
      - "8000"
    depends_on:
      - database
      - node
    command: >
      sh -c "composer update --no-interaction &&
             php bin/console doctrine:migrations:migrate --no-interaction &&
             php bin/console doctrine:fixtures:load --no-interaction &&
             php -S 0.0.0.0:8000 -t public"

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      target: app-dev
      platforms:
        - linux/arm64
    container_name: mjv-web-scheduler
    environment:
      APP_ENV: dev
      DATABASE_URL: ${DATABASE_URL}
    volumes:
      - ./:/app:rw,cached
    depends_on:
      - app
      - database
    restart: unless-stopped
    command: >
      sh -c "php bin/console messenger:consume scheduler_scrape_matches -vv"

  node:
    image: node:20-alpine
    platform: linux/arm64
    container_name: mjv-web-node
    working_dir: /app
    volumes:
      - ./:/app:rw,cached
    command: >
      sh -c "until [ -f vendor/symfony/ux-turbo/assets/package.json ]; do echo 'Waiting for vendor...'; sleep 2; done &&
             npm install &&
             npm run watch"

  database:
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    platform: linux/arm64
    container_name: mjv-web-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-!ChangeMe!}
      POSTGRES_USER: ${POSTGRES_USER:-app}
    volumes:
      - database_data:/var/lib/postgresql/data:rw

volumes:
  database_data:
  caddy_data:
  caddy_config:
