[www]
; Run as non-root
user = appuser
group = appuser

; Listen on TCP (for Caddy reverse proxy)
listen = 0.0.0.0:9000

; Process manager: static for predictable memory usage on a VPS
pm = static
pm.max_children = 5
pm.max_requests = 1000

; Logging
access.log = /dev/null
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /dev/stderr
