name: Test & Deploy

on:
  push:
    branches: [master]

# Prevent overlapping deployments
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Run PHPUnit tests
  # ---------------------------------------------------------------------------
  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: app_test
          POSTGRES_USER: app
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_pgsql, zip, intl
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies & build assets
        run: npm ci && npm run build

      - name: Run PHPUnit (Unit tests)
        env:
          APP_ENV: test
          DATABASE_URL: "postgresql://app:test@localhost:5432/app_test?serverVersion=16&charset=utf8"
        run: php vendor/bin/phpunit --testsuite=Unit

  # ---------------------------------------------------------------------------
  # Job 2: Deploy to production VPS via SSH
  # ---------------------------------------------------------------------------
  build-and-deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: test
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd ${{ secrets.VPS_APP_PATH }}

            echo "==> Pulling latest code..."
            git pull origin master

            echo "==> Building and restarting containers..."
            docker compose -f compose.prod.yaml up --build -d

            echo "==> Cleaning up old Docker images..."
            docker image prune -f

            echo "==> Deployment complete!"
