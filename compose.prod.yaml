services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app-prod
      platforms:
        - linux/amd64
    container_name: mjv-web-app-prod
    restart: unless-stopped
    environment:
      APP_ENV: prod
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: ${DATABASE_URL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
    volumes:
      - app_public:/srv/public
      - uploads_data:/app/public/uploads
    expose:
      - "9000"
    networks:
      - default   # database, scheduler
      - proxy     # joignable par le reverse-proxy Caddy
    depends_on:
      database:
        condition: service_started
    user: root
    entrypoint: ["sh", "-c"]
    command:
      - |
        cp -a /app/public/. /srv/public/ &&
        ln -sf /app/vendor /srv/vendor &&
        chown -R appuser:appuser /srv/public &&
        php bin/console doctrine:migrations:migrate --no-interaction &&
        php-fpm

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      target: app-prod
      platforms:
        - linux/amd64
    container_name: mjv-web-scheduler-prod
    restart: unless-stopped
    environment:
      APP_ENV: prod
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      app:
        condition: service_started
      database:
        condition: service_started
    command: ["php", "bin/console", "messenger:consume", "scheduler_default", "-vv"]

  scraper:
    build:
      context: .
      dockerfile: Dockerfile.scraper
      platforms:
        - linux/amd64
    container_name: mjv-web-scraper-prod
    restart: "no"
    profiles:
      - scraper
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      database:
        condition: service_started

  database:
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    platform: linux/amd64
    container_name: mjv-web-db-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER:-app}
    volumes:
      - database_data_prod:/var/lib/postgresql/data:rw
    deploy:
      resources:
        limits:
          memory: 512M

networks:
  proxy:
    external: true

volumes:
  database_data_prod:
  # app_public est monté en lecture seule par la stack proxy (Caddy sert les
  # assets statiques en direct). Nom externe attendu : mjv-web_app_public.
  app_public:
  uploads_data:
