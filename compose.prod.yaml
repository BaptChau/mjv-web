services:
  caddy:
    image: caddy:2-alpine
    container_name: mjv-web-caddy-prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - caddy_data_prod:/data
      - caddy_config_prod:/config
    depends_on:
      - app

  app:
    build:
      context: .
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
    container_name: mjv-web-app-prod
    restart: unless-stopped
    environment:
      APP_ENV: prod
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: ${DATABASE_URL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
    expose:
      - "8000"
    depends_on:
      - database
    command: >
      sh -c "composer install --no-dev --optimize-autoloader --no-interaction &&
             php bin/console doctrine:migrations:migrate --no-interaction &&
             php bin/console cache:warmup &&
             php -S 0.0.0.0:8000 -t public"

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
    container_name: mjv-web-scheduler-prod
    restart: unless-stopped
    environment:
      APP_ENV: prod
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      - app
      - database
    command: >
      sh -c "php bin/console messenger:consume scheduler_scrape_matches -vv"

  database:
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    platform: linux/amd64
    container_name: mjv-web-db-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER:-app}
    volumes:
      - database_data_prod:/var/lib/postgresql/data:rw

volumes:
  database_data_prod:
  caddy_data_prod:
  caddy_config_prod:
